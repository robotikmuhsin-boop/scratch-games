
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kendin Kodla, Kendin Oyna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<style>
  :root {
    --bg: #f4f1ea;
    --bg-2: #ece7dc;
    --ink: #1c1b1a;
    --ink-soft: #4a4744;
    --paper: #ffffff;
    --accent: #ff5b2e;
    --accent-soft: #ffe7df;
    --like: #1f9d55;
    --like-soft: #e3f6ec;
    --line: #e6e1d6;
    --shadow-sm: 0 1px 2px rgba(28, 27, 26, 0.04), 0 2px 8px rgba(28, 27, 26, 0.04);
    --shadow-md: 0 8px 24px rgba(28, 27, 26, 0.08), 0 2px 6px rgba(28, 27, 26, 0.04);
    --shadow-lg: 0 24px 48px rgba(28, 27, 26, 0.12), 0 8px 16px rgba(28, 27, 26, 0.06);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Outfit', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    background-image:
      radial-gradient(circle at 12% 8%, rgba(255, 91, 46, 0.10) 0, transparent 38%),
      radial-gradient(circle at 88% 6%, rgba(31, 157, 85, 0.10) 0, transparent 42%),
      radial-gradient(circle at 50% 100%, rgba(28, 27, 26, 0.05) 0, transparent 50%);
    background-attachment: fixed;
    min-height: 100vh;
  }

  ::selection { background: var(--accent); color: #fff; }

  /* Header */
  .header {
    padding: 72px 24px 40px;
    text-align: center;
    max-width: 980px;
    margin: 0 auto;
    position: relative;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-soft);
    box-shadow: var(--shadow-sm);
    margin-bottom: 28px;
  }

  .eyebrow .dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  h1.title {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: clamp(2.4rem, 6vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -0.02em;
    margin: 0 0 20px;
    color: var(--ink);
  }

  h1.title .accent {
    font-style: italic;
    color: var(--accent);
    font-weight: 500;
  }

  .subtitle {
    font-size: clamp(1rem, 1.6vw, 1.125rem);
    color: var(--ink-soft);
    max-width: 640px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .header-meta {
    margin-top: 32px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: 14px;
    color: var(--ink-soft);
    padding: 12px 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: var(--shadow-sm);
  }

  .header-meta strong { color: var(--ink); font-weight: 700; }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 96px;
  }

  @media (min-width: 1024px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 32px; }
  }

  /* Card */
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: transform 280ms cubic-bezier(.2,.7,.2,1),
                box-shadow 280ms cubic-bezier(.2,.7,.2,1),
                border-color 280ms ease;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(12px);
    animation: rise 600ms cubic-bezier(.2,.7,.2,1) forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: #d8d2c2;
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--line);
  }

  .card-head-left {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-family: 'Fraunces', serif;
    font-size: 18px;
    flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
  }

  .name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
    line-height: 1.1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tag {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .open-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    background: var(--bg);
    transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
    flex-shrink: 0;
  }

  .open-btn:hover {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .frame-wrap {
    position: relative;
    background: var(--bg-2);
  }

  .frame-wrap iframe {
    width: 100%;
    height: 450px;
    border: none;
    display: block;
    background: #fff;
  }

  .card-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 16px 22px 20px;
  }

  .like-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 220ms ease, color 220ms ease, border-color 220ms ease, transform 180ms ease;
    user-select: none;
  }

  .like-btn:hover { transform: translateY(-1px); border-color: #d8d2c2; }
  .like-btn:active { transform: translateY(0) scale(0.98); }

  .like-btn i { font-size: 14px; transition: transform 240ms cubic-bezier(.5,1.6,.4,1); }

  .like-btn.liked {
    background: var(--like);
    color: #fff;
    border-color: var(--like);
  }

  .like-btn.liked i { transform: scale(1.18); }

  .like-btn .count {
    background: rgba(28, 27, 26, 0.06);
    padding: 2px 9px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    min-width: 28px;
    text-align: center;
  }

  .like-btn.liked .count { background: rgba(255,255,255,0.18); }

  .meta-info {
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  /* Heart pop */
  .heart-pop {
    position: absolute;
    pointer-events: none;
    color: var(--like);
    font-size: 22px;
    opacity: 0;
    animation: pop 700ms ease-out forwards;
  }

  @keyframes pop {
    0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(-50%, -50px) scale(1.4); opacity: 0; }
  }

  /* Footer */
  .site-footer {
    text-align: center;
    padding: 32px 24px 56px;
    color: var(--ink-soft);
    font-size: 13px;
    border-top: 1px dashed var(--line);
    max-width: 1280px;
    margin: 0 auto;
  }

  .site-footer .mark {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-style: italic;
    color: var(--ink);
  }

  /* Skeleton on load */
  .frame-wrap.loading::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, var(--bg-2) 8%, #f5f1e8 18%, var(--bg-2) 33%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
</style>
</head>
<body>

<header class="header">
  <span class="eyebrow"><span class="dot"></span> Robotik Atölyesi · Öğrenci Sergisi</span>
  <h1 class="title">Kendin Kodla, <span class="accent">Kendin Oyna</span></h1>
  <p class="subtitle">
    Lütfen oylamayı tarafsız bir biçimde, geliştiricinin emeğine saygı duyarak beğen butonuna basarak veriniz.
  </p>
  <div class="header-meta">
    <i class="fa-solid fa-gamepad" style="color: var(--accent);"></i>
    <span><strong id="totalGames">0</strong> oyun sergileniyor</span>
    <span style="opacity: 0.4;">·</span>
    <i class="fa-solid fa-heart" style="color: var(--like);"></i>
    <span><strong id="totalLikes">0</strong> toplam beğeni</span>
  </div>
</header>

<main class="grid" id="grid"></main>

<footer class="site-footer">
  Tüm projeler öğrencilerimizin emeğiyle <span class="mark">Scratch</span> üzerinde geliştirilmiştir.
</footer>

<script>
  const gameUrls = [
    "https://robotikmuhsin-boop.github.io/scratch-games/abdulkerim.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/alikagan.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ardakar.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/asimkerem.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/aysebayir.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ayseilayda.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ayseyaren.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/bekir.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/belinayelif.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/berat.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/cemrerabia.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/dursun.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/elifyagmur.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/elisaoyku.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/enar.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/esilanur.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/fatmailayda.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/fatmanur.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/gokhan.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/gulnisa.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/gulperi.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/humeyra.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ilkay.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/lutfi.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/meyra.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/miray.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/mustafa.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/nisaceylin.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ranaecrin.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ravzanur.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/rizvan.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/salman.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/talha.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/talhahasan.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/talhayusuf.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yagiz.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yagmurnisa.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yahya.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yasin.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yasin6b.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yavuz.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yigit.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yusufhalil.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/yusufkoca.html",
    "https://robotikmuhsin-boop.github.io/scratch-games/ziya.html"
  ];

  // Pretty palette for avatars (no purple/violet on white)
  const palette = [
    "#ff5b2e", "#1f9d55", "#1c1b1a", "#0f6fb3", "#c2410c",
    "#0d9488", "#b91c1c", "#4d7c0f", "#7c2d12", "#0369a1"
  ];

  // URL -> "Yasin6b"
  function fileNameToTitle(url) {
    const last = url.split("/").pop() || "";
    const base = last.replace(/\.html$/i, "");
    if (!base) return "Bilinmiyor";
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  function initialsOf(name) {
    return name.replace(/[^a-zA-ZçğıöşüÇĞİÖŞÜ]/g, "").charAt(0).toUpperCase() || "?";
  }

  // Stable color from string
  function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
    return palette[h % palette.length];
  }

  // localStorage helpers
  const LS_KEY = "scratch-games-likes-v1";
  function loadLikes() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch { return {}; }
  }
  function saveLikes(state) {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch {}
  }

  const likesState = loadLikes(); // { [name]: 0|1 }

  function updateTotals() {
    document.getElementById("totalGames").textContent = gameUrls.length;
    const sum = Object.values(likesState).reduce((a, b) => a + (b ? 1 : 0), 0);
    document.getElementById("totalLikes").textContent = sum;
  }

  function spawnHeart(button) {
    const rect = button.getBoundingClientRect();
    const heart = document.createElement("span");
    heart.className = "heart-pop";
    heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
    heart.style.left = (rect.left + rect.width / 2) + "px";
    heart.style.top = (rect.top + window.scrollY - 6) + "px";
    heart.style.position = "absolute";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 750);
  }

  function buildCard(url, index) {
    const name = fileNameToTitle(url);
    const color = colorFor(name);
    const liked = !!likesState[name];

    const card = document.createElement("article");
    card.className = "card";
    card.style.animationDelay = (index * 40) + "ms";
    card.setAttribute("data-testid", `game-card-${name.toLowerCase()}`);

    card.innerHTML = `
      <div class="card-head">
        <div class="card-head-left">
          <div class="avatar" style="background:${color};" aria-hidden="true">${initialsOf(name)}</div>
          <div style="min-width:0;">
            <h2 class="name" title="${name}">${name}</h2>
            <div class="tag">Scratch · Öğrenci Projesi</div>
          </div>
        </div>
        <a class="open-btn" href="${url}" target="_blank" rel="noopener noreferrer" data-testid="open-game-${name.toLowerCase()}">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> Yeni Sekme
        </a>
      </div>
      <div class="frame-wrap loading">
        <iframe
          src="${url}"
          loading="lazy"
          allow="autoplay; fullscreen; gamepad"
          referrerpolicy="no-referrer"
          title="${name} - Scratch oyunu"
          data-testid="game-iframe-${name.toLowerCase()}"></iframe>
      </div>
      <div class="card-foot">
        <button
          type="button"
          class="like-btn ${liked ? "liked" : ""}"
          data-name="${name}"
          aria-pressed="${liked}"
          data-testid="like-btn-${name.toLowerCase()}">
          <i class="fa-${liked ? "solid" : "regular"} fa-heart"></i>
          <span class="label">${liked ? "Beğenildi" : "Beğen"}</span>
          <span class="count" data-testid="like-count-${name.toLowerCase()}">${liked ? 1 : 0}</span>
        </button>
        <span class="meta-info"><i class="fa-regular fa-clock"></i> &nbsp;Anlık oylama</span>
      </div>
    `;

    const wrap = card.querySelector(".frame-wrap");
    const iframe = card.querySelector("iframe");
    iframe.addEventListener("load", () => wrap.classList.remove("loading"));

    const btn = card.querySelector(".like-btn");
    btn.addEventListener("click", () => {
      const isLiked = btn.classList.toggle("liked");
      const icon = btn.querySelector("i");
      const label = btn.querySelector(".label");
      const count = btn.querySelector(".count");

      if (isLiked) {
        icon.classList.remove("fa-regular");
        icon.classList.add("fa-solid");
        label.textContent = "Beğenildi";
        count.textContent = "1";
        likesState[name] = 1;
        spawnHeart(btn);
      } else {
        icon.classList.remove("fa-solid");
        icon.classList.add("fa-regular");
        label.textContent = "Beğen";
        count.textContent = "0";
        likesState[name] = 0;
      }
      btn.setAttribute("aria-pressed", String(isLiked));
      saveLikes(likesState);
      updateTotals();
    });

    return card;
  }

  function render() {
    const grid = document.getElementById("grid");
    const frag = document.createDocumentFragment();
    gameUrls.forEach((u, i) => frag.appendChild(buildCard(u, i)));
    grid.appendChild(frag);
    updateTotals();
  }

  render();
</script>

<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v833ccba57c9e4d2798f2e76cebdd09a11778172276447" integrity="sha512-57MDmcccJXYtNnH+ZiBwzC4jb2rvgVCEokYN+L/nLlmO8rfYT/gIpW2A569iJ/3b+0UEasghjuZH/ma3wIs/EQ==" data-cf-beacon='{"version":"2024.11.0","token":"7f7b0fd8732c4326aae4b9d58d5c514a","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
